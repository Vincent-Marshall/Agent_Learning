# MewHelp 站点配置(部署于 /etc/nginx/sites-enabled/)
# 同源部署:前端构建产物由 nginx 直接托管,API/后台页反代到 FastAPI —— 架构上避免跨源。
# 域名审核通过后:server_name 换成域名,并追加 443 端口 HTTPS(证书见 DEPLOY.md)。
server {
    listen 80;
    server_name 42.193.189.196;

    root /home/ubuntu/app/frontend/dist;
    index index.html;

    # 前端静态资源:命中本地文件直接返回;未命中(后台各页路由 /kb、/admin 等)交给 FastAPI
    location / {
        try_files $uri $uri/ @backend;
    }
    location @backend {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 与 SSE 流式:关缓冲(逐帧透传)、放宽读超时(流式长连接)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后台页静态资源(FastAPI 的 /static 挂载)
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
