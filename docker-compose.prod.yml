# 生产环境资源限制与运维策略(叠加在 docker-compose.yml 之上:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d)
# 4C8G 服务器口径:Milvus 栈限 3G、MySQL 限 768M,给应用/MCP/nginx/系统留余量;
# 全部 restart=unless-stopped(开机自启/崩溃自愈)+ 日志轮转防爆盘。

services:
  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  etcd:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  milvus-standalone:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
